# Copiar como .github/workflows/accesibilidad-dinamica.yml en el repositorio
# que se quiere revisar. Es todo lo que ese repositorio necesita además de su
# a11y-lab.json (ver docs/github-actions.md, "Usarlo en otro repositorio").
name: Accesibilidad dinámica

on:
  pull_request:

# El comentario en el Pull Request necesita este permiso: el workflow
# reutilizable no puede tener más permisos que los que da el llamador.
permissions:
  contents: read
  pull-requests: write

# Una corrida por Pull Request: la última es la única que describe el cambio.
concurrency:
  group: a11y-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  a11y:
    # Fijar una etiqueta (por ejemplo @estudio-v1) da corridas reproducibles;
    # @main recibe las mejoras del framework apenas se publican.
    uses: codepathcr/a11y-regression-lab/.github/workflows/a11y-reusable.yml@main
    with:
      install-command: npm ci
      build-command: npm run build
      dist-dir: dist
      # Empezar sin modelo es lo más rápido para probar. Para usar uno, quitar
      # esta línea y definir las variables A11Y_LLM_* (ver la guía).
      mode: no-model
    secrets:
      A11Y_LLM_API_KEY: ${{ secrets.A11Y_LLM_API_KEY }}
      FRAMEWORK_TOKEN: ${{ secrets.FRAMEWORK_TOKEN }}
